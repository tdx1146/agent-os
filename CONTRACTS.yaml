# =============================================================
# CONTRACTS.yaml — Agent OS 组件间契约注册表（机器可校验）
# -------------------------------------------------------------
# 依据：《系统反复修复方法论调研-20260811.md》§3.1 契约层设计
#        TOPOLOGY.md §2 模块间契约表（权威内容源）
#        SYSTEM.md 数据流总图 / SYSTEM_HEALTH.md 巡检手册
# 用途：把「人看的契约表」变成「机器可校验的 CONTRACTS.yaml」，
#       让 contract_check.sh（本仓 scripts/）逐项自动校验；
#       契约漂移（改 A 的 API，B/C/D 悄悄坏）在当天被 ❌ 拦住。
# 执行：bash scripts/contract_check.sh   （只读，退出码 0/1/2）
# 纪律：
#   - 任何跨组件接口变更（字段/语义/路径/端口）必须先改本文件
#     并跑通 contract_check.sh，再动代码（CDC：契约属于消费方）。
#   - 阈值 = SLO；黄 = 偏离但仍可用；红 = 契约被违反。
#   - 历史陷阱必须保留成 check + notes（last_surprise 缺席 /
#     FTS 同步 / 多关键词搜索），防复发。
# =============================================================

schema_version: 1.0
updated: "2026-08-11"

# -------------------------------------------------------------
# 一、components — 每个组件的存在性契约（健康判定）
# -------------------------------------------------------------
components:
  sandglass:
    name: 沙漏
    role: 明线-保底流水账（txt 是权威源，SQLite 只作索引）
    health:
      http: "http://127.0.0.1:17333/api/health"   # 实际端点（SYSTEM.md；/health 根路径不存在）
      file: "sandglass.txt"                        # 相对 NEXSANDBASE_HOME
      file_min_mtime_minutes: 30                   # txt 30 分钟内必须更新（白天活跃线）
  lms:
    name: LMS 活体记忆
    role: 暗线-FEP 塑形（熵/惊讶/目的），:8190 主口 + :8191 控制口
    health:
      http: "http://127.0.0.1:8190/health"
      control_port: 8191
  glue:
    name: 胶水层
    role: 统一编排（读侧 /recall /soul，写侧 /store），三后端融合 0.3/0.5/0.2
    health:
      http: "http://127.0.0.1:19000/health"
      backends: [sandglass, lms, vector]           # 三后端必须全 healthy（任一降级=读侧断）
  bus:
    name: Agent OS 总线
    role: 事件骨架（event_bus.jsonl + scheduler/consumer）
    health:
      file: "iso-sand/data/event_bus.jsonl"
      file_min_mtime_minutes: 10                   # 10min 内必须有写入
      processes: [scheduler, consumer]
  verify_daemon:
    name: 玄鉴
    role: 审外监督（5min 巡检 operation_log → daemon_audit.log）
    health:
      file: "data/daemon_audit.log"                # 相对 VERIFY_HOME
      file_min_mtime_minutes: 10
  self_pulse:
    name: self_pulse 自主唤醒
    role: 每 10min 唤醒链（salience_gate → sleep_pressure → wake_client）
    health:
      files: ["/tmp/pulse-status.json", "salience_state.json", "sleep_pressure.json"]
      file_min_mtime_minutes: 15                   # 10min cron，允许 15min 内
  night_patrol:
    name: 夜巡（doubt-system）
    role: 每日 23:30 怀疑闭环 → findings 写沙漏 + doubt.db
    health:
      marker: "workspace/logs/night_patrol.last_run"
      db: "doubt.db"                               # 相对 NEXSANDBASE_HOME
  plugin:
    name: OpenClaw 插件 glue-memory-injector
    role: 每轮对话前经 glue 注入 [回魂]+[记忆注入]（fail-open）
    health:
      log: "/tmp/glue-hook-debug.log"
      pattern: "INJECTED"
  backup:
    name: LMS 备份
    role: 15min/小时/每日 三档快照
    health:
      log: "logs/lms_backup_cron.log"              # 相对 LMS_HOME
      no_error_pattern: "ERROR|失败|rc=[^0]"
  openclaw:
    name: OpenClaw Gateway
    role: 宿主（毛毛本体，hooks/wake 端点）
    health:
      port: 10554

# -------------------------------------------------------------
# 二、contracts — 组件间调用契约（TOPOLOGY §2 的机器化）
#    每条挂一个 check_id；机器校验定义见「三、checks」
# -------------------------------------------------------------
contracts:
  - id: C-01
    from: self_pulse
    to: lms
    method: GET
    path: "/status/{sid}"
    required_fields: [entropy_ratio, purpose_coherence, turn_count]
    check_id: C-01
    notes: >
      历史陷阱 c（2026-08-11 诊断）：self_pulse 曾硬索引 latest["avg_surprise"]
      → KeyError → 唤醒链瘫痪。契约：熵比/目的/轮次缺一即违反；
      last_surprise 可缺席（重启后无对话），缺席不算违反；若在场必须是 >=0 的 float。
      字段语义变更（惊讶度）必须先同步全部 consumers（self_pulse/salience_gate/glue）。
  - id: C-02
    from: plugin(glue-memory-injector)
    to: glue
    method: POST
    path: "/recall"
    required_fields: [count, "results[].origin", "results[].text"]
    check_id: C-02
    notes: "读侧注入：count:int 且 = results 长度；results 每项必须带 origin/text。"
  - id: C-03
    from: plugin
    to: glue
    method: POST
    path: "/soul"
    required_fields: [ok, lms_state, recent]
    check_id: C-03
    notes: "回魂快照：ok:true + lms_state 字典 + recent 列表（fail-open，不得阻塞）。"
  - id: C-04
    from: glue(写侧 storeTurn) / 编辑器直写
    to: sandglass
    method: file-append
    path: "sandglass.txt"
    required_fields: ["ts|sender|text 行格式"]
    check_id: C-04
    notes: "落沙是明线保底：txt 30min 内必须更新；db 镜像持续追平（见 SG-05）。"
  - id: C-05
    from: consumer(LmsFeedHandler)
    to: lms
    method: POST
    path: "/feed"
    event: "sandglass.entry / task_complete / doubt.episode"
    check_id: C-05
    notes: >
      总线→LMS 塑形通道（P0-3 方向 1，dddbb91 接通）。
      证据型校验（只读，不真发 POST）：consumer.log 近 100 行内
      「LMS /feed 失败」出现 0 次=绿。2026-08-11 实测 503（系统做梦时
      acquire_conversation 超时）→ 死信 128 条 → 契约红。
  - id: C-06
    from: doubt_adapter(胶水层)
    to: bus
    method: event
    path: "event_bus.jsonl"
    event: "doubt.episode"
    check_id: C-06
    notes: "怀疑闭环：doubt.episode 事件 48h 内必须出现（夜巡 23:30 产生）。"
  - id: C-07
    from: sandglass(落沙成功)
    to: bus
    method: event
    path: "event_bus.jsonl"
    event: "sandglass.entry"
    check_id: C-07
    notes: "P0-3 方向 1：落沙成功发 sandglass.entry（payload: text/sender/ts/source）。30min 内必须有。"
  - id: C-08
    from: self_pulse
    to: openclaw
    method: POST
    path: "/hooks/wake"
    check_id: C-08
    notes: "唤醒 A 通道（实证 8/7）。只读可校验部分=10554 在听 + pulse 链活着；实际唤醒动作有副作用，不做真发。"
  - id: C-09
    from: night_patrol
    to: sandglass
    method: file-append
    path: "sandglass.txt"
    event: "findings tag=旁观者-警讯"
    check_id: C-09
    notes: "夜巡 findings 必须写沙漏（tag=旁观者-警讯），7 天内必须有。"
  - id: C-10
    from: verify_daemon
    to: bus(operation_log)
    method: read+audit
    path: "data/operation_log.jsonl"
    check_id: C-10
    notes: "玄鉴 5min 巡检 operation_log → daemon_audit.log；audit 日志 10min 内必须更新。"
  - id: C-11
    from: verify_daemon(push_verify)
    to: agent-os git (GitHub origin)
    method: git
    path: "git rev-parse HEAD == git ls-remote origin HEAD"
    check_id: C-11
    notes: >
      玄鉴 push_verify 契约：本地 agent-os 与远端 GitHub 必须同步。
      2026-08-11 实测违反：本地 187ec330 ≠ 远端 1ad86d48，
      近 17h 连续 FAIL 148 次（全部该根因）。
  - id: C-12
    from: night_patrol
    to: doubt.db
    method: sqlite-write
    path: "doubt.db (doubt_episode / memory_trust)"
    check_id: C-12
    notes: "怀疑账本：doubt_episode 表必须有行且 db 48h 内有写入（夜巡/怀疑钩子）。"
  - id: C-13
    from: plugin(glue-memory-injector)
    to: lms
    method: POST
    path: "/recall"
    required_fields: ["count", "results[].origin", "results[].text"]
    check_id: C-13
    notes: >
      体验层 D（设计 v1.1 §8.1）：结果条目增量置信度字段
      （confidence/rebuttal_count/labile/source_trust/last_recalled_at）——
      C-02 required 不变 → 绿；新字段为 optional_fields（缺席不违约，
      归档条目 origin='archive' 无置信度字段）。
  - id: C-14
    from: self_pulse(salience_gate)
    to: lms
    method: GET
    path: "/status/{sid}"
    required_fields: [entropy_ratio, purpose_coherence, turn_count]
    check_id: C-14
    notes: >
      体验层 D（设计 v1.1 §8.1）：status 增量 doubt 字段
      （gaps{fok_unresolved,low_confidence_unreviewed}/labile_count/
      low_confidence_count/last_review）——C-01 required 不变 → 绿；
      doubt 为 optional_fields（缺席不违约）。explore_dims 仅诊断
      （C 类不进怀疑灯，专注化修订 §6.6）。
  - id: C-15
    from: doubt_adapter(胶水层)
    to: lms
    method: POST
    path: "/feed"
    event: "doubt.episode"
    check_id: C-15
    notes: >
      怀疑闭环（体验层 D，设计 v1.1 §8.1）：doubt.episode 事件经
      doubt_adapter → glue /store → LMS /feed 结构化摄入（doubt_ingest，
      fail-open）。无前缀=普通塑形逐字节不变。健康校验=共享 /feed 通道
      无失败（consumer.log 证据型，同 C-05 通道）。
  - id: C-16
    from: plugin(glue-memory-injector)
    to: lms
    method: POST
    path: "/react"
    required_fields: ["reaction.surprise(float≥0)", "interpretation(str 非空)"]
    check_id: C-16
    notes: >
      实时反应只读端点（体验层 A，设计 v1.1 §8.1）：infer-only 零持久化
      （不 learn/不落 episodic/不写回 sigma/turn_count 不变），探针
      user_input 固定串 + k=0 作 30min 契约巡检安全、不污染大脑。
      可缺席=系统未启用，不违约（fail-open）。check type=http_json，
      contract_check.sh 通用解析器零脚本改动自动接入。
  - id: C-17
    from: plugin(glue-memory-injector agent_end)
    to: glue
    method: POST
    path: "/store-turn"
    required_fields: [session_id, turn_count, stored, dedup_hit]
    check_id: C-17
    notes: >
      提取层阶段2（S2-7，设计 v1.1 §3.2/§5.1）：/store 写侧薄代理契约
      （插件 agent_end → glue /store-turn → LMS /store，timeout=10s）。
      请求：{session_id, user_input, llm_output, sender}——sender 仅 glue
      日志审计用，不转发（LMS StoreRequest 无此字段，不改 LMS）。
      响应（透传不改结构）：200 StoreResponse（session_id/turn_count/stored/
      dedup_hit/value_filtered/core_chars/gray/surprise/info_value/reason）；
      429=限流（Retry-After 透传）；503=做梦协调/embed 熔断降级
      （Retry-After:30，预期失败 C-05 先例，插件不重试）；422=会话不在
      白名单（不应出现，白名单=main）；400=user_input 必填；
      502=LMS 不可达（fail-open）。M-1 判据 3 数据源：stored 由 /store
      响应给出（只有真写入才 true），独立权威对账。

# -------------------------------------------------------------
# 三、checks — 机器执行定义（contract_check.sh 逐项跑）
#    type 支持：http_json / json_file_assert / file_fresh /
#    file_grep_recent / process_alive / port_listen / sqlite_ratio /
#    sandglass_mirror / jsonl_level_count / log_failure_ratio /
#    crontab_has / backup_log / date_file_recent / git_sync
#    path 中 $VAR 由 env.local 插值（不硬编码绝对路径）
# -------------------------------------------------------------
checks:

  # ================= 沙漏 sandglass =================
  - id: SG-01
    component: sandglass
    name: 沙漏 API 存活
    type: http_json
    method: GET
    url: "http://127.0.0.1:${SANDGLASS_API_PORT}/api/health"
    timeout: 6
    asserts:
      - {path: "status", eq: "ok", note: "健康端点必须回 ok"}
      - {path: "sandglass_count", gt: 0, note: "落沙计数必须 > 0"}

  - id: SG-02
    component: sandglass
    name: 落沙明文更新（明线保底）
    type: file_fresh
    path: "${NEXSANDBASE_HOME}/sandglass.txt"
    ok_seconds: 1800
    warn_seconds: 21600
    notes: "30min 内必须更新（白天活跃线）；6h 无写入=黄；更久=红（明线断=失忆根源）"

  - id: SG-03
    component: sandglass
    name: 落沙索引更新
    type: file_fresh
    path: "${NEXSANDBASE_HOME}/sandglass.idx"
    ok_seconds: 3600
    warn_seconds: 7200
    notes: "索引 1h 内更新=绿；2h 内=黄；更久=红（检索退化）"

  - id: SG-04
    component: sandglass
    name: db 内部 FTS 镜像同步
    type: sqlite_ratio
    db: "${NEXSANDBASE_HOME}/sandglass.db"
    numerator: "SELECT COUNT(*) FROM sandglass_fts"
    denominator: "SELECT COUNT(*) FROM sandglass"
    ok_min: 0.95
    warn_min: 0.80
    notes: "FTS 表必须 ≥ 基表 95%（内部镜像一致性）"

  - id: SG-05
    component: sandglass
    name: db 镜像 vs txt 权威源（历史陷阱 a：FTS 冻结）
    type: sandglass_mirror
    txt: "${NEXSANDBASE_HOME}/sandglass.txt"
    db: "${NEXSANDBASE_HOME}/sandglass.db"
    table: sandglass
    ok_min: 0.95
    warn_min: 0.80
    notes: >
      历史陷阱 a（2026-08-11）：db 906 vs txt 4871 冻结 20 天无人发现。
      SLI：db 行数 ≥ txt 去重后有效条目 95%。口径：txt 有双写历史（同一
      (ts,sender,text) 重复落行，实测 563 行），db 镜像按失忆根因-2 设计去重
      → 分母用去重条目数（2026-08-11 修正，此前按原始行数 1550 计 → 假红 63.7%）。
      守护：scripts/sandglass_sync.sh 每 10min 增量同步，同步率 <95% 自动全量重建。

  - id: SG-06
    component: sandglass
    name: 多关键词搜索（历史陷阱：多关键词检索）
    type: http_json
    method: POST
    url: "http://127.0.0.1:${SANDGLASS_API_PORT}/api/memory_search"
    body: {"query": "沙漏 冻结", "k": 2}
    timeout: 8
    asserts:
      - {path: "results", nonempty: true, note: "多关键词必须能命中（2026-08-11 实测通过）"}

  # ================= LMS =================
  - id: LM-01
    component: lms
    name: LMS API 存活
    type: http_json
    method: GET
    url: "http://127.0.0.1:${LMS_API_PORT}/health"
    timeout: 6
    asserts:
      - {path: "status", eq: "ok"}

  - id: LM-02
    component: lms
    name: LMS /status/main 可读（暗线状态非空=非降级）
    type: http_json
    method: GET
    url: "http://127.0.0.1:${LMS_API_PORT}/status/main"
    timeout: 6
    json_root: status
    asserts:
      - {path: "entropy_ratio", exists: true, note: "熵比缺失=契约违反（self_pulse 依赖）"}
      - {path: "purpose_coherence", exists: true}
      - {path: "turn_count", exists: true, note: "轮次空=静默降级（.env 未 source），见 SYSTEM.md 坑 2"}
    notes: "/status 返回空对象 = .env 未 source 的静默降级信号"

  - id: LM-03
    component: lms
    name: LMS 控制口 :8191
    type: port_listen
    port: 8191

  - id: LM-04
    component: lms
    name: LMS /react 实时反应只读探针（体验层 A C-16）
    type: http_json
    method: POST
    url: "http://127.0.0.1:${LMS_API_PORT}/react"
    body: {"user_input": "契约校验探针", "k": 0}
    timeout: 8
    asserts:
      - {path: "reaction.surprise", ge: 0, note: "惊讶度=准确性项恒≥0（语义红线）"}
      - {path: "interpretation", nonempty: true, note: "解读段必须非空"}
      - {path: "turn_count", exists: true, note: "只读锚点（探针调用不应改变轮次）"}
    notes: >
      体验层 A：/react infer-only 零持久化（不 learn/不落 episodic/不写回
      sigma/turn_count 不变），探针固定串+k=0 作契约巡检安全、不污染大脑。
      可缺席=系统未启用，不违约（fail-open）。

  - id: LM-05
    component: lms
    name: LMS /recall 置信度字段（体验层 D C-13，optional）
    type: http_json
    method: POST
    url: "http://127.0.0.1:${LMS_API_PORT}/recall"
    body: {"query": "置信度字段探针", "k": 2, "session_id": "main"}
    timeout: 8
    asserts:
      - {path: "count", exists: true, note: "C-02 required 不变"}
      - {path: "results", type: "list", note: "C-02 required 不变"}
    optional_fields:
      - {path: "results.0.confidence", if_present: {type: "float"}, note: "置信度（optional，缺席不违约）"}
      - {path: "results.0.rebuttal_count", if_present: {type: "int"}, note: "反驳次数（optional）"}
    notes: "体验层 D：/recall 条目置信度字段（C-02 不变 → 绿）。"

  - id: LM-06
    component: lms
    name: LMS /status doubt 字段（体验层 D C-14，optional）
    type: http_json
    method: GET
    url: "http://127.0.0.1:${LMS_API_PORT}/status/main"
    timeout: 8
    json_root: status
    asserts:
      - {path: "entropy_ratio", exists: true, note: "C-01 required 不变"}
      - {path: "purpose_coherence", exists: true, note: "C-01 required 不变"}
    optional_fields:
      - {path: "doubt", if_present: {type: "dict"}, note: "doubt 增量字段（optional，缺席不违约）"}
      - {path: "doubt.gaps", if_present: {type: "dict"}, note: "信息缺口（A/B 类进灯，C 类仅诊断）"}
      - {path: "doubt.labile_count", if_present: {type: "int"}, note: "去稳定化计数（optional）"}
    notes: "体验层 D：/status doubt 增量字段（C-01 不变 → 绿）。"

  - id: LM-07
    component: lms
    name: doubt.episode → LMS /feed 摄入健康（体验层 D C-15）
    type: log_failure_ratio
    log: "${LOG_DIR}/consumer.log"
    fail_pattern: "LMS /feed 失败"
    ok_pattern: "lms.feed 处理成功"
    tail_lines: 100
    ok_max_fail: 0
    warn_max_fail: 3
    notes: "怀疑闭环摄入通道（doubt.episode 经 /feed 结构化摄入，doubt_ingest fail-open）；共享 /feed 通道无失败=绿（同 C-05 证据型校验）。"

  # ================= 胶水 glue =================
  - id: GL-01
    component: glue
    name: 胶水三后端健康
    type: http_json
    method: GET
    url: "http://127.0.0.1:${GLUE_PORT}/health"
    timeout: 6
    asserts:
      - {path: "backends.sandglass.healthy", eq: true, note: "沙漏后端降级=读侧断"}
      - {path: "backends.lms.healthy", eq: true}
      - {path: "backends.vector.healthy", eq: true, note: "向量后端（手机 bge-m3）降级=融合缺 0.5 权重"}

  # ================= 总线 bus =================
  - id: BUS-01
    component: bus
    name: 事件总线写入
    type: file_fresh
    path: "${ISO_SAND_HOME}/data/event_bus.jsonl"
    ok_seconds: 600
    warn_seconds: 1800
    notes: "10min 内必须写入（调度器心跳/事件）；30min=黄；更久=红（总线断）"

  - id: BUS-02
    component: bus
    name: 操作日志写入
    type: file_fresh
    path: "${ISO_SAND_HOME}/data/operation_log.jsonl"
    ok_seconds: 600
    warn_seconds: 1800

  - id: BUS-03
    component: bus
    name: 调度器进程
    type: process_alive
    pidfile: "${ISO_SAND_HOME}/data/scheduler.pid"

  - id: BUS-04
    component: bus
    name: 消费者进程
    type: process_alive
    pidfile: "${ISO_SAND_HOME}/data/consumer.pid"

  - id: BUS-05
    component: bus
    name: 死信队列（近期）
    type: dlq_recent
    dlq: "${ISO_SAND_HOME}/data/.dead_letter_queue.jsonl"
    ok_max: 0
    warn_max: 5
    notes: "近 24h 死信：0=绿；≤5=黄；>5=红（消费者链在吐事件，2026-08-11 /feed 503 即此）"

  # ================= 玄鉴 verify_daemon =================
  - id: VD-01
    component: verify_daemon
    name: 玄鉴进程
    type: process_alive
    pidfile: "${VERIFY_HOME}/data/daemon.pid"

  - id: VD-02
    component: verify_daemon
    name: 玄鉴审计日志更新（5min 巡检活着）
    type: file_fresh
    path: "${VERIFY_HOME}/data/daemon_audit.log"
    ok_seconds: 600
    warn_seconds: 1800

  - id: VD-03
    component: verify_daemon
    name: 玄鉴审计发现（近 300 行 FAIL 数）
    type: jsonl_level_count
    log: "${VERIFY_HOME}/data/daemon_audit.log"
    tail_lines: 300
    level: FAIL
    ok_max: 0
    warn_max: 5
    notes: "0 FAIL=绿；≤5=黄；>5=红。2026-08-11 实测 148 条 FAIL 全部为 push_verify 仓库分叉（见 C-11）"

  # ================= self_pulse =================
  - id: SP-01
    component: self_pulse
    name: pulse 状态更新
    type: file_fresh
    path: "/tmp/pulse-status.json"
    ok_seconds: 900
    warn_seconds: 1800
    notes: "10min cron；15min 内=绿"

  - id: SP-02
    component: self_pulse
    name: pulse 退出码
    type: json_file_assert
    path: "/tmp/pulse-status.json"
    asserts:
      - {path: "pulse_rc", eq: 0, note: "rc≠0=唤醒链脚本报错"}

  - id: SP-03
    component: self_pulse
    name: 显著性状态更新
    type: file_fresh
    path: "${NEXSANDBASE_HOME}/salience_state.json"
    ok_seconds: 900
    warn_seconds: 1800

  - id: SP-04
    component: self_pulse
    name: 睡眠压力状态更新
    type: file_fresh
    path: "${NEXSANDBASE_HOME}/sleep_pressure.json"
    ok_seconds: 900
    warn_seconds: 1800

  # ================= 夜巡 night_patrol =================
  - id: NP-01
    component: night_patrol
    name: 夜巡 marker（每日 23:30）
    type: date_file_recent
    path: "${WORKSPACE}/logs/night_patrol.last_run"
    allow_today_or_yesterday: true
    notes: "marker 内容=日期；必须是今天或昨天。历史 bug：cron 路径空格拆词导致从未真跑"

  - id: NP-02
    component: night_patrol
    name: 怀疑账本 doubt.db 写入
    type: file_fresh
    path: "${NEXSANDBASE_HOME}/doubt.db"
    ok_seconds: 172800
    warn_seconds: 604800
    notes: "48h 内有写入=绿；7 天内=黄；更久=红（夜巡/怀疑钩子停摆）"

  - id: NP-03
    component: night_patrol
    name: 怀疑账本有记录
    type: sqlite_gt
    db: "${NEXSANDBASE_HOME}/doubt.db"
    query: "SELECT COUNT(*) FROM doubt_episode"
    gt: 0
    notes: "doubt_episode 表必须非空（2026-08-11 实测 15 行）"

  # ================= OpenClaw 插件 =================
  - id: PL-01
    component: plugin
    name: 记忆注入日志
    type: file_grep_recent
    path: "/tmp/glue-hook-debug.log"
    pattern: "INJECTED"
    ok_seconds: 86400
    warn_seconds: 604800
    notes: "1 天内有注入=绿；7 天内=黄；无 INJECTED 或更久=红（读侧断=AI 失忆）"

  - id: PL-02
    component: openclaw
    name: Gateway hooks 端口 :10554
    type: port_listen
    port: 10554

  # ================= 备份 =================
  - id: BK-01
    component: backup
    name: LMS 备份无 ERROR + 快照新鲜
    type: backup_log
    log: "${LMS_HOME}/logs/lms_backup_cron.log"
    snap_dir: "${BACKUP_ROOT}/snapshots-15min"
    ok_seconds: 1800
    warn_seconds: 7200
    notes: "日志近 40 行无 ERROR/失败/rc!=0 且 15min 快照 30min 内=绿"

  # ================= cron 完整性 =================
  - id: CR-01
    component: openclaw
    name: cron 关键任务在位
    type: crontab_has
    keys: ["pulse-cron.sh", "night_patrol_run.sh", "lms_backup.sh", "health-check.sh", "start_all.sh", "session-reset-watchdog"]
    notes: "怀疑三把锁 + 备份 + 巡检 + 自启必须全在位"

  # ================= 组件间契约 C-xx =================
  - id: C-01
    component: contract
    name: self_pulse → LMS /status/{sid} 字段契约
    type: http_json
    method: GET
    url: "http://127.0.0.1:${LMS_API_PORT}/status/main"
    timeout: 6
    json_root: status
    asserts:
      - {path: "entropy_ratio", exists: true, note: "缺=违反（self_pulse 依赖，硬索引曾 KeyError）"}
      - {path: "purpose_coherence", exists: true}
      - {path: "turn_count", exists: true}
    optional_fields:
      - {path: "last_surprise", if_present: {type: float, ge: 0}, note: "历史陷阱：重启后无对话可缺席；若在场必须 >=0 float"}
    notes: "严禁消费者硬索引 avg_surprise（已废弃字段名）；惊讶度语义变更必须先同步全部下游"

  - id: C-02
    component: contract
    name: plugin → glue POST /recall 返回结构
    type: http_json
    method: POST
    url: "http://127.0.0.1:${GLUE_PORT}/recall"
    body: {"query": "契约校验", "k": 1}
    timeout: 8
    asserts:
      - {path: "count", type: int, note: "count 必须是 int"}
      - {path: "results", type: list, note: "results 必须是 list"}
      - {path: "results.0.origin", exists: true, note: "每项必须带 origin（sandglass/lms/vector）"}
      - {path: "results.0.text", exists: true}

  - id: C-03
    component: contract
    name: plugin → glue POST /soul 回魂结构
    type: http_json
    method: POST
    url: "http://127.0.0.1:${GLUE_PORT}/soul"
    body: {"limit": 1, "recent_n": 1}
    timeout: 8
    asserts:
      - {path: "ok", eq: true}
      - {path: "lms_state", type: dict}
      - {path: "recent", type: list}

  - id: C-04
    component: contract
    name: 写侧 → 沙漏落沙（明线）
    type: file_fresh
    path: "${NEXSANDBASE_HOME}/sandglass.txt"
    ok_seconds: 1800
    warn_seconds: 21600
    notes: "落沙是全局保底：txt 30min 内必须更新（同 SG-02，契约视角复述）"

  - id: C-05
    component: contract
    name: consumer → LMS POST /feed 通道（P0-3 方向 1）
    type: log_failure_ratio
    log: "${LOG_DIR}/consumer.log"
    fail_pattern: "LMS /feed 失败"
    ok_pattern: "lms.feed 处理成功"
    tail_lines: 100
    ok_max_fail: 0
    warn_max_fail: 3
    notes: "只读证据校验。2026-08-11 实测：sandglass.entry→/feed 503（做梦冲突）→死信，契约红"

  - id: C-06
    component: contract
    name: doubt_adapter → 总线 doubt.episode
    type: jsonl_event_recent
    log: "${ISO_SAND_HOME}/data/event_bus.jsonl"
    event_type: doubt.episode
    ok_seconds: 172800
    warn_seconds: 604800
    notes: "怀疑闭环事件 48h 内必须出现（夜巡 23:30 产生；2026-08-11 实测 00:52 有）"

  - id: C-07
    component: contract
    name: 沙漏 → 总线 sandglass.entry
    type: jsonl_event_recent
    log: "${ISO_SAND_HOME}/data/event_bus.jsonl"
    event_type: sandglass.entry
    ok_seconds: 1800
    warn_seconds: 7200
    notes: "P0-3 方向 1 已接通（dddbb91）：落沙成功必须发事件；30min 内=绿"

  - id: C-08
    component: contract
    name: self_pulse → OpenClaw /hooks/wake（A 通道）
    type: port_listen
    port: 10554
    notes: "只读可校验部分：wake 端点宿主在听（10554）；真实唤醒有副作用不做真发"

  - id: C-09
    component: contract
    name: 夜巡 → 沙漏 findings（旁观者-警讯）
    type: file_grep_recent
    path: "${NEXSANDBASE_HOME}/sandglass.txt"
    pattern: "旁观者-警讯"
    ok_seconds: 604800
    warn_seconds: 1209600
    notes: "夜巡 findings 7 天内必须写沙漏；无=夜巡输出无效（历史陷阱 b）"

  - id: C-10
    component: contract
    name: 玄鉴 → operation_log 审计
    type: file_fresh
    path: "${VERIFY_HOME}/data/daemon_audit.log"
    ok_seconds: 600
    warn_seconds: 1800
    notes: "玄鉴 5min 巡检 operation_log：audit 日志 10min 内必须更新"

  - id: C-11
    component: contract
    name: agent-os 本地 ↔ GitHub 远端同步（push_verify）
    type: git_sync
    repo: "${AGENT_OS_HOME}"
    remote: origin
    timeout: 20
    notes: >
      玄鉴 push_verify 契约。2026-08-11 实测违反：本地 187ec330 ≠ 远端 1ad86d48，
      近 17h FAIL 148 次（VD-03 红的根因）。ls-remote 超时=无法核验（黄），不等同于违反。

  - id: C-12
    component: contract
    name: 夜巡 → doubt.db 怀疑账本
    type: sqlite_gt
    db: "${NEXSANDBASE_HOME}/doubt.db"
    query: "SELECT COUNT(*) FROM doubt_episode"
    gt: 0
    notes: "怀疑账本必须非空（同 NP-03，契约视角复述）"

  - id: C-17
    component: contract
    name: 插件 agent_end → glue POST /store-turn 写侧透传（只读探针）
    type: http_json
    method: POST
    url: "http://127.0.0.1:${GLUE_PORT}/store-turn"
    body: {"session_id": "main", "user_input": "[Subagent Context] contract-probe（C-17 只读探针，垃圾过滤不落库）", "llm_output": "contract-probe", "sender": "contract_check"}
    timeout: 12
    asserts:
      - {path: "session_id", eq: "main", note: "透传响应含 session_id"}
      - {path: "turn_count", type: int, note: "turn_count 顶层 int（B3）"}
      - {path: "stored", type: bool, note: "正常路径=false（垃圾过滤不落库）；60s 窗口内重复跑 dedup 路径=true（同样不产生新写入）"}
      - {path: "dedup_hit", type: bool, note: "正常路径=false；重复跑=true"}
      - {path: "reason", exists: true, note: "正常路径=filtered_garbage；dedup 路径=null（键存在即可）"}
    notes: >
      只读探针（S2-7）：user_input 含 [Subagent Context] → LMS 垃圾过滤
      （memory.py _is_garbage_text）→ stored=false 不写 episodic——全链路
      验证（路由/转发/LMS 可达/响应结构）零污染。两种合法结果：
      ①正常路径（30min cron 间隔>60s 幂等窗口）：stored=false、
      dedup_hit=false、reason=filtered_garbage；②同一 payload 在 60s 窗口内
      重复跑：dedup_hit=true（幂等窗口命中，同样不产生新写入、turn 不增）——
      两种都不算违约，故断言用类型/存在性而非固定值。副作用：探针仍走
      process_turn → turn_count +1（与 /chat 查询回声同类已知污染，
      M-1 已声明 /status turn 仅参考不作判据）。
