<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #1a1a2e; color: #e0e0e0; overflow: hidden; height: 100vh; }
#graph { width: 100vw; height: 100vh; }
#tooltip {
  position: fixed; display: none; background: rgba(30,30,50,0.95); border: 1px solid #4a4a7a;
  border-radius: 8px; padding: 12px 16px; font-size: 13px; max-width: 420px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.6); z-index: 1000; pointer-events: none;
  line-height: 1.5;
}
#tooltip .tt-title { font-size: 15px; font-weight: 600; color: #8ab4f8; margin-bottom: 4px; }
#tooltip .tt-sub { color: #a0a0b0; font-size: 12px; }
#tooltip .tt-row { margin-top: 3px; }
#tooltip .tt-label { color: #888; }
#tooltip .tt-val { color: #ccc; }
#search-container {
  position: fixed; top: 16px; right: 16px; z-index: 900;
  display: flex; flex-direction: column; gap: 8px;
  align-items: flex-end;
}
#search-container input {
  padding: 8px 14px; border-radius: 20px; border: 1px solid #4a4a7a;
  background: rgba(30,30,50,0.9); color: #e0e0e0; font-size: 14px;
  width: 240px; outline: none; transition: border-color 0.2s;
}
#search-container input:focus { border-color: #8ab4f8; }
#search-container input::placeholder { color: #666; }
#stats {
  position: fixed; bottom: 16px; left: 16px; z-index: 900;
  font-size: 12px; color: #666; background: rgba(30,30,50,0.7);
  padding: 6px 12px; border-radius: 12px;
}
#legend {
  position: fixed; bottom: 16px; right: 16px; z-index: 900;
  font-size: 11px; max-height: 300px; overflow-y: auto;
  background: rgba(30,30,50,0.85); border: 1px solid #3a3a5a;
  border-radius: 8px; padding: 10px 14px; max-width: 260px;
}
#legend .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
#legend .legend-item:hover { background: rgba(255,255,255,0.05); }
#legend .legend-color { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
#legend .legend-name { color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#legend .legend-count { color: #666; margin-left: auto; font-size: 10px; }
#legend h4 { color: #888; font-size: 11px; margin-bottom: 6px; font-weight: 500; }
#detail-panel {
  position: fixed; top: 60px; right: 16px; z-index: 950;
  width: 340px; max-height: calc(100vh - 90px); overflow-y: auto;
  background: rgba(30,30,50,0.92); border: 1px solid #4a4a7a;
  border-radius: 10px; padding: 16px; display: none;
  box-shadow: 0 4px 32px rgba(0,0,0,0.5);
}
#detail-panel .dp-close { float: right; cursor: pointer; color: #666; font-size: 18px; padding: 0 4px; }
#detail-panel .dp-close:hover { color: #e15759; }
#detail-panel .dp-name { font-size: 16px; font-weight: 700; color: #8ab4f8; margin-bottom: 6px; }
#detail-panel .dp-type { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
#detail-panel .dp-section { margin-top: 10px; }
#detail-panel .dp-section-title { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
#detail-panel .dp-summary { font-size: 13px; color: #bbb; line-height: 1.5; }
#detail-panel .dp-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; background: rgba(138,180,248,0.15); color: #8ab4f8; font-size: 11px; margin: 2px 3px 2px 0; }
#detail-panel .dp-param { font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; color: #f0c0a0; }
svg text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
.highlighted { filter: drop-shadow(0 0 6px #ffd700); }
.faded { opacity: 0.15 !important; }
.highlight-link { stroke: #ffd700 !important; stroke-width: 2.5 !important; }
</style>

    .attr("fill", "#5a5a8a");

defs.append("filter").attr("id", "glow")
  .append("feDropShadow").attr("dx", 0).attr("dy", 0).attr("stdDeviation", 3).attr("flood-color", "#8ab4f8").attr("flood-opacity", 0.4);

const mainG = svg.append("g").attr("class", "main-group");
const zoom = d3.zoom()
    .scaleExtent([0.1, 6])
    .on("zoom", (event) => mainG.attr("transform", event.transform));
svg.call(zoom);

// ---- Build node maps ----
const nodeMap = new Map();

const fileNodes = DATA.fileDetails.map(f => ({
    id: f.id,
    name: f.name,
    filePath: f.filePath,
    type: "file",
    summary: f.summary,
    sizeLines: f.sizeLines,
    fileCategory: f.fileCategory,
    language: f.language,
    complexity: f.complexity,
    tags: f.tags || [],
    color: DATA.fileColorMap[f.id] || "#666",
    funcCount: (DATA.fileFuncMap[f.id] || []).length
}));
fileNodes.forEach(n => nodeMap.set(n.id, n));

const funcNodes = DATA.funcDetails.map(f => ({
    id: f.id,
    name: f.name,
    file: f.file,
    fileId: f.fileId,
    type: "function",
    summary: f.summary,
    params: f.params || [],
    startLine: f.startLine,
    endLine: f.endLine,
    complexity: f.complexity || "",
    tags: f.tags || []
}));
funcNodes.forEach(n => nodeMap.set(n.id, n));

const linkData = DATA.callEdges.map(e => ({
    source: e.source,
    target: e.target,
    weight: e.weight || 1
})).filter(e => nodeMap.has(e.source) && nodeMap.has(e.target));

// ---- Resolve string IDs to objects for D3 ----
const simNodes = funcNodes.slice();
const simLinks = linkData.map(e => ({
    source: e.source,
    target: e.target,
    weight: e.weight
}));

// ---- Force simulation ----
const simulation = d3.forceSimulation(simNodes)
    .force("link", d3.forceLink(simLinks).id(d => d.id)
        .distance(d => 70 + 40 / (d.weight || 1))
        .strength(0.3))
    .force("charge", d3.forceManyBody().strength(-200))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collision", d3.forceCollide(16));

// ---- Draw links ----
const link = mainG.append("g")
    .selectAll("line")
    .data(simLinks)
    .join("line")
    .attr("stroke", "#3a3a6a")
    .attr("stroke-width", d => Math.min(3, 0.5 + (d.weight || 1) * 0.5))
    .attr("stroke-opacity", 0.5)
    .attr("marker-end", "url(#arrow)");

// ---- Draw function nodes ----
const funcGroup = mainG.append("g").selectAll("g.func-node")
    .data(simNodes)
    .join("g")
    .attr("class", "func-node")
    .style("cursor", "pointer")
    .call(d3.drag()
        .on("start", (event, d) => {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        })
        .on("drag", (event, d) => {
            d.fx = event.x;
            d.fy = event.y;
        })
        .on("end", (event, d) => {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        })
    );

funcGroup.append("circle")
    .attr("r", d => {
        const pc = (DATA.fileFuncMap[d.fileId] || []).length;
        return Math.max(6, Math.min(14, 8 + 6 * (1 - pc / Math.max(pc, 30))));
    })
    .attr("fill", d => {
        const fn = fileNodes.find(f => f.id === d.fileId);
        return fn ? fn.color : "#888";
    })
    .attr("stroke", "#2a2a4a")
    .attr("stroke-width", 1.5)
    .attr("opacity", 0.85);

// Labels
funcGroup.append("text")
    .text(d => d.name.length > 18 ? d.name.slice(0, 16) + "\u2026" : d.name)
    .attr("dx", 14)
    .attr("dy", 4)
    .attr("font-size", "10px")
    .attr("fill", "#a0a0b0")
    .attr("opacity", 0.7)
    .style("pointer-events", "none");

// ---- Tick ----
simulation.on("tick", () => {
    link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

    funcGroup.attr("transform", d => `translate(${d.x},${d.y})`);
});

// ---- Tooltip ----
const tooltip = d3.select("#tooltip");
funcGroup.on("mouseover", function(event, d) {
    const fn = d;
    const fileN = fileNodes.find(f => f.id === fn.fileId);
    const filePath = fn.file || (fileN ? fileN.filePath : "");
    let html = `<div class="tt-title">${fn.name}</div>`;
    html += `<div class="tt-sub">${filePath}`;
    if (fn.startLine) html += ` <span style="color:#666">:${fn.startLine}${fn.endLine ? '-' + fn.endLine : ''}</span>`;
    html += "</div>";
    if (fn.params && fn.params.length > 0) {
        html += `<div class="tt-row"><span class="tt-label">参数:</span> <span class="tt-val">${fn.params.join(', ')}</span></div>`;
    }
    if (fn.complexity) {
        html += `<div class="tt-row"><span class="tt-label">复杂度:</span> <span class="tt-val">${fn.complexity}</span></div>`;
    }
    if (fileN) {
        html += `<div class="tt-row"><span class="tt-label">模块:</span> <span class="tt-val">${fileN.name} (${fileN.fileCategory || '?'})</span></div>`;
    }
    tooltip.html(html)
        .style("display", "block")
        .style("left", (event.pageX + 14) + "px")
        .style("top", (event.pageY - 10) + "px");

    d3.select(this).select("circle").attr("filter", "url(#glow)").attr("opacity", 1);
})
.on("mousemove", function(event) {
    tooltip.style("left", (event.pageX + 14) + "px").style("top", (event.pageY - 10) + "px");
})
.on("mouseout", function() {
    tooltip.style("display", "none");
    d3.select(this).select("circle").attr("filter", null).attr("opacity", 0.85);
});

// ---- Click to show detail panel ----
const dp = d3.select("#detail-panel");
funcGroup.on("click", function(event, d) {
    event.stopPropagation();
    showDetail(d);
});

svg.on("click", function() {
    dp.style("display", "none");
});

d3.select("#dp-close").on("click", () => dp.style("display", "none"));

function showDetail(d) {
    const fn = d;
    const fileN = fileNodes.find(f => f.id === fn.fileId);
    dp.select("#dp-type").text("函数");
    dp.select("#dp-name").text(fn.name);
    dp.select("#dp-summary").text(fn.summary || "无描述");

    const tagsDiv = dp.select("#dp-tags");
    tagsDiv.html("");
    (fn.tags || []).forEach(t => tagsDiv.append("span").attr("class","dp-tag").text(t));

    const paramsDiv = dp.select("#dp-params");
    paramsDiv.text(fn.params && fn.params.length > 0 ? fn.params.join(', ') : "无参数");

    const locDiv = dp.select("#dp-location");
    let loc = fn.file || (fileN ? fileN.filePath : "未知");
    if (fn.startLine) loc += ` <span style="color:#666">第 ${fn.startLine}${fn.endLine ? ' - ' + fn.endLine : ''} 行</span>`;
    locDiv.html(loc);

    dp.select("#dp-complexity").text(fn.complexity || "未评估");

    // Show calls info
    const outCalls = simLinks.filter(e => e.source.id === fn.id);
    const inCalls = simLinks.filter(e => e.target.id === fn.id);
    let extra = "";
    if (outCalls.length > 0 || inCalls.length > 0) {
        extra = `<br/><br/><span style="color:#888">→ 调用 ${outCalls.length} 个函数</span><br/>`;
        extra += `<span style="color:#888">← 被 ${inCalls.length} 个函数调用</span>`;
    }
    dp.select("#dp-summary").html((fn.summary || "无描述") + extra);

    dp.style("display", "block");
}

// ---- Search ----
const searchInput = document.getElementById("search-input");
searchInput.addEventListener("input", function() {
    const q = this.value.trim().toLowerCase();
    if (!q) {
        funcGroup.classed("faded", false).classed("highlighted", false);
        link.classed("faded", false).classed("highlight-link", false);
        funcGroup.select("circle").attr("opacity", 0.85);
        link.attr("stroke-opacity", 0.5);
        return;
    }

    const matchedIds = new Set();
    funcNodes.forEach(fn => {
        if (fn.name.toLowerCase().includes(q) ||
            (fn.file && fn.file.toLowerCase().includes(q)) ||
            (fn.tags && fn.tags.some(t => t.toLowerCase().includes(q)))) {
            matchedIds.add(fn.id);
        }
    });
    fileNodes.forEach(fn => {
        if (fn.name.toLowerCase().includes(q) || fn.filePath.toLowerCase().includes(q)) {
            (DATA.fileFuncMap[fn.id] || []).forEach(fid => matchedIds.add(fid));
        }
    });

    if (matchedIds.size === 0) {
        funcGroup.classed("faded", true).classed("highlighted", false);
        link.classed("faded", true).classed("highlight-link", false);
        funcGroup.select("circle").attr("opacity", 0.15);
        link.attr("stroke-opacity", 0.1);
        return;
    }

    funcGroup.each(function(d) {
        const el = d3.select(this);
        if (matchedIds.has(d.id)) {
            el.classed("faded", false).classed("highlighted", true);
            el.select("circle").attr("opacity", 1);
        } else {
            el.classed("faded", true).classed("highlighted", false);
            el.select("circle").attr("opacity", 0.08);
        }
    });

    link.each(function(d) {
        const el = d3.select(this);
        const srcMatched = matchedIds.has(d.source.id);
        const tgtMatched = matchedIds.has(d.target.id);
        if (srcMatched && tgtMatched) {
            el.classed("faded", false).classed("highlight-link", true);
            el.attr("stroke-opacity", 0.9);
        } else if (srcMatched || tgtMatched) {
            el.classed("faded", false).classed("highlight-link", false);
            el.attr("stroke-opacity", 0.3);
        } else {
            el.classed("faded", true).classed("highlight-link", false);
            el.attr("stroke-opacity", 0.05);
        }
    });
});

// ---- Legend ----
const legendDiv = d3.select("#legend");
const fileEntries = fileNodes.sort((a,b) => (b.funcCount - a.funcCount));
fileEntries.forEach(fn => {
    const row = legendDiv.append("div").attr("class","legend-item");
    row.append("div").attr("class","legend-color").style("background", fn.color);
    row.append("div").attr("class","legend-name").text(fn.name);
    row.append("div").attr("class","legend-count").text(fn.funcCount);
    row.on("click", () => {
        const funcsInFile = DATA.fileFuncMap[fn.id] || [];
        if (funcsInFile.length > 0) {
            funcGroup.classed("faded", false).classed("highlighted", false);
            funcGroup.select("circle").attr("opacity", 0.85);
            link.classed("faded", false).classed("highlight-link", false);
            link.attr("stroke-opacity", 0.5);

            const matchSet = new Set(funcsInFile);
            funcGroup.each(function(d) {
                const el = d3.select(this);
                if (matchSet.has(d.id)) {
                    el.select("circle").attr("opacity", 1).attr("filter", "url(#glow)");
                } else {
                    el.classed("faded", true);
                    el.select("circle").attr("opacity", 0.08);
                }
            });
            link.each(function(d) {
                const el = d3.select(this);
                const s = matchSet.has(d.source.id);
                const t = matchSet.has(d.target.id);
                if (s && t) {
                    el.classed("faded", false).classed("highlight-link", true);
                    el.attr("stroke-opacity", 0.9);
                } else if (s || t) {
                    el.classed("faded", false);
                    el.attr("stroke-opacity", 0.2);
                } else {
                    el.classed("faded", true);
                    el.attr("stroke-opacity", 0.05);
                }
            });
        }
    });
});

// ---- Stats ----
d3.select("#stats").text(`\u{1f4ca} ${funcNodes.length} 函数 · ${linkData.length} 调用边 · ${fileNodes.length} 文件`);

// ---- Resize ----
window.addEventListener("resize", () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    svg.attr("width", w).attr("height", h);
    simulation.force("center", d3.forceCenter(w / 2, h / 2));
    simulation.alpha(0.3).restart();
});

// ---- Keyboard shortcuts ----
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        dp.style("display", "none");
        searchInput.value = "";
        searchInput.dispatchEvent(new Event("input"));
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "f") {
        e.preventDefault();
        searchInput.focus();
    }
});

console.log(`Loaded: ${funcNodes.length} functions, ${linkData.length} edges`);
</script>
</body>
</html>
