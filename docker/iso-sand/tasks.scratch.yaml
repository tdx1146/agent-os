# tasks.scratch.yaml — 沙箱验证用任务配置（Phase 7）
# ============================================================
# 仅用于容器化验证（ISO_SAND_TASKS_FILE=/docker/iso-sand/tasks.scratch.yaml）。
# 与生产 tasks.yaml 的区别：
#   - 心跳改为每分钟一次（生产每 5 分钟），便于快速验证
#   - command 指向沙箱专用脚本 /docker/iso-sand/scratch_heartbeat.py
#     （由 ISO_SAND_DATA_DIR 驱动写入沙箱 event_bus.jsonl，绝不碰真实总线）
#   - 不含任何真实任务（bus_heartbeat 之外的 task 全部移除，避免副作用）
# 生产切换：compose .env 中 ISO_SAND_TASKS_FILE 恢复默认
#   /app/iso-sand/deploy/tasks.yaml 即可。

scheduler:
  tick_interval: 30

tasks:
  # 沙箱心跳：写 sandglass.heartbeat 事件（v1.1 契约）证明调度器存活
  # 消费者不订阅 heartbeat 类型（噪音），无任何副作用
  - id: bus_heartbeat
    schedule: "* * * * *"
    command: "python3 /docker/iso-sand/scratch_heartbeat.py"
    timeout: 30
    description: "沙箱心跳：验证 flock 写入挂载卷（每分钟）"
