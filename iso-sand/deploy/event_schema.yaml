# event_schema.yaml — 事件数据契约（D7 契约三件套）
# v1.1 — Phase 1 统一总线骨架
#
# 变更（相对 v1.0）：
#   1. schema_version 强制字段：事件必带；老事件（v1.0）无该字段时 consumer 容忍并默认 "1.0"
#   2. event_type 注册表：集中登记全部事件类型 + 预留各系统命名空间（Phase 2/4 启用）
#   3. event_id（UUID，可选）：consumer 按 event_id 幂等去重（内存集合 + data/processed_ids.jsonl）
#   4. trace_id 从 optional 升级为硬规范：生产者必带；consumer 对缺失事件打 WARN 但继续处理
#   5. log_writer.write() 字段校验保持向后兼容（老事件无 schema_version/event_id 不拒绝）

schema_version: "1.1"
version: "1.1"

# ---------------------------------------------------------------------------
# event_type 注册表（谁产生 → 谁订阅，集中登记防冲突）
# ---------------------------------------------------------------------------
event_types:

  # --- 核心事件（v1.0 已有，Phase 1 在用）---
  - name: task_complete
    description: "定时任务完成（producer: task_scheduler/*）"
    status: active
  - name: anomaly
    description: "系统异常/降级信号"
    status: active
  - name: audit_result
    description: "审计结果（玄鉴审计完成）"
    status: active
  - name: milestone
    description: "里程碑达成"
    status: active
  - name: consumer_action
    description: "消费者自身动作记录（operation_log）"
    status: active

  # --- 预留命名空间（Phase 2 接入各系统 producer/handler 时启用）---
  - name: xuanjian.pipe
    description: "玄鉴评分结果（最高价值 producer，D2 迁回主总线）"
    status: reserved_phase2
  - name: xuanjian.audit_result
    description: "玄鉴校验结果（verify_daemon）"
    status: reserved_phase2
  - name: sandglass.heartbeat
    description: "沙漏存活/告警通知（仅观测，不统合）"
    status: reserved_phase2
  - name: interfaces.store
    description: "胶水层记忆写入动作（Phase 3 已启用：总线→glue_server /store 聚合写入沙漏+LMS+向量）"
    status: active
  - name: interfaces.recall
    description: "胶水层记忆召回动作（Phase 3 已启用：总线→glue_server /recall 加权融合，结果写回 operation_log）"
    status: active
  - name: scheduler.tick
    description: "调度器敲钟信号"
    status: reserved_phase2
  - name: scheduler.task_done
    description: "调度器任务完成信号"
    status: reserved_phase2
  - name: ai.decided
    description: "主AI轻命令（判断落点）"
    status: reserved_phase2
  - name: ai.action_done
    description: "主AI动作完成"
    status: reserved_phase2

  # --- Phase 4 LMS 双向反馈中枢（D0，已启用）---
  # 生产者=LMS，均为软参考信号：订阅方可忽略，总线是哑管道
  - name: lms.plastified
    description: "LMS 塑形倾向/状态反哺（数值摘要，软参考信号，订阅方可忽略；生产者=LMS）"
    status: active
  - name: lms.self_ref
    description: "LMS 自我认知透视（蒸馏后限量发布，最高敏感度，默认关闭；软参考信号，订阅方可忽略）"
    status: active
  - name: lms.dream_complete
    description: "LMS 做梦完成通知（可观测性信号；软参考，订阅方可忽略）"
    status: active
  - name: doubt.episode
    description: "怀疑闭环事件（Phase 6：doubt-system 账本→总线→lms.feed 喂 LMS 塑形；producer=interfaces.doubt；payload: trigger_type/suspicion/user_reaction/topic）"
    status: active
  - name: lms.feed
    description: "LMS 塑形喂入动作（消费者=总线 handler lms.feed；只喂不指挥，软参考）"
    status: active

# ---------------------------------------------------------------------------
# 必填字段（v1.1）
# ---------------------------------------------------------------------------
required_fields:
  - field: t
    type: ISO8601
    description: "事件时间，ISO 8601 格式，含时区"
  - field: schema_version
    type: string
    description: "契约版本（v1.1 强制）；老事件无该字段时 consumer 容忍并默认 1.0"
    default: "1.0"
  - field: event_type
    type: string
    description: "事件类型，必须在 event_types 注册表中"
  - field: producer
    type: string
    description: "产生事件的模块名，如 xuanjian.pipe, task_scheduler/health_check 等"
  - field: result
    type: string
    enum: [OK, FAIL, WARN, TIMEOUT]
    description: "事件结果状态"
  - field: trace_id
    type: string
    description: "追踪链 ID（v1.1 硬规范）：生产者必带，用于跨模块串联/兜底排查；consumer 对缺失事件打 WARN 但继续处理"

# ---------------------------------------------------------------------------
# 可选字段（v1.1）
# ---------------------------------------------------------------------------
optional_fields:
  - field: event_id
    type: UUID
    description: "幂等去重键（推荐必带）：consumer 按 event_id 去重，容忍 at-least-once 重投；去重持久化在 data/processed_ids.jsonl"
  - field: detail
    type: string
    description: "事件详情描述"
  - field: payload
    type: object
    description: "事件负载，按事件类型自由扩展（契约只约束公共字段，payload 自由）"

# ---------------------------------------------------------------------------
# 幂等去重规范（v1.1 新增）
# ---------------------------------------------------------------------------
idempotency:
  key: event_id
  scope: consumer
  storage: "data/processed_ids.jsonl（追加） + 内存集合（上限 100k，超限仅内存暂停增长）"
  semantics: "同一 event_id 只执行一次 handler；无 event_id 的老事件不参与去重（向后兼容）"

# ---------------------------------------------------------------------------
# 兼容规则（v1.1）
# ---------------------------------------------------------------------------
compatibility:
  backward: "v1.0 老事件（无 schema_version/event_id）可被 v1.1 consumer 正常消费：schema_version 默认 1.0，不参与去重"
  forward: "新事件（v1.1 必带 schema_version/trace_id，推荐带 event_id）不破坏老消费者（老消费者忽略未知字段）"
